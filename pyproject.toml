[project]
name = "dftracer-genesis-analysis"
version = "0.1.0"
description = "Tutorials that analyze the genesis sweep traces with the dftracer-utils Python API"
requires-python = ">=3.12"
dependencies = [
    "dftracer-utils==0.0.14",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupytext>=1.19.6",
    "nbconvert>=7.17.1",
    "nbmake>=1.5.5",
    "pytest>=9.1.1",
]

[tool.uv.sources]
dftracer-utils = { path = "../dftracer-utils", editable = true }
